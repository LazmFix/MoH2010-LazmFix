; MoH 2010 PC Fix settings. The ReShade panel (Home -> Add-ons -> MoH 2010 PC Fix) writes this file;
; without ReShade, edit it here (game closed).

[Startup]
; 1 = fix the hang on the splash screen: SecuROM reads from every device DirectInput opens, and a HID
;     interface that never sends data (some gaming mice and keyboards) makes that read wait forever.
HidFix=1
; 1 = skip the intro videos (renames MOHAGame\CookedMovies\MOHA_Legal_ID_Only*.vp6 to *.vp6.skip).
SkipIntros=1
; 1 = English keyboard layout in the game: its hints name keys with the active layout ("ЦФЫВ" instead
;     of "WASD"). Controls do not depend on the layout.
EnglishKeyboard=1
; 0 = on the next start: game mouse smoothing off, frame rate cap at the desktop refresh rate, and the
;     "High end" graphics preset (see [Graphics]). Set to 1 by the fix afterwards.
FirstStartDone=0

[Display]
; borderless = window without a frame over the whole monitor (no display mode change, desktop refresh
;              rate, instant Alt+Tab); fullscreen = exclusive fullscreen (highest refresh rate);
; windowed   = the game's own window.
WindowMode=borderless
; desktop = the desktop resolution at every start; game = the resolution set in the game / the panel.
Resolution=desktop
; Field of view: horizontal degrees at 16:9 (the game: 70). 0 = the game's. Wider screens get more at
; the sides (Hor+). CoD4 / MWR cg_fov 65 = 80.7, 80 = 96.4, 90 = 106.3.
FOV=0
; Subtitle and marker / name tag size: 0 = automatic (height / 720, the game's sizes are for 720p),
; or a factor 1..4.
SubtitleScale=0
MarkerScale=0
; 1 = the four-tick crosshair scales with the resolution (the game leaves it at 720p pixels).
CrosshairScale=1
; 1 = the game sees real pixels at any Windows display scaling.
DpiAware=1

[Mouse]
; The game reads the mouse with DirectInput: raw counts, no Windows acceleration.
; Enabled=1: multiply the counts by SensitivityX / SensitivityY (on top of the game's slider).
; Mode=mwr: the panel keeps the multiplier at the turn per count of CoD4 / MWR at MwrSensitivity.
Enabled=0
Mode=multiplier
SensitivityX=1.000
SensitivityY=1.000
MwrSensitivity=3.000
; Aiming down sights. game = the game's x0.75 for every zoom; mwr = as CoD4 / MWR:
; x tan(aim FOV / 2) / tan(FOV / 2), following the zoom; custom = AdsMultiplier while aiming.
AdsMode=game
AdsMultiplier=0.75
; Aim zoom: game = the weapon's own FOV; mwr = the weapon's number read as CoD degrees (4:3), like MWR.
AdsFov=game

[Graphics]
; 1 = apply the game's "High end" preset on the first start with the fix: its hardware detection files
;     current graphics cards under "Minspec" (no dynamic shadows, 1x filtering).
HighEndOnFirstStart=1
; 1 = apply it on the next start (the panel's button sets this).
ApplyHighEnd=0

[UI]
; Panel language: en or ru.
Language=en
